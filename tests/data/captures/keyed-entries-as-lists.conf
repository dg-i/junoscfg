## show configuration policy-options
policy-statement SAMPLE-POLICY {
    term T1 {
        from {
            as-path-neighbors as-list SAMPLE-AS-LIST;
            as-path-origins as-list-group SAMPLE-AS-LIST-GROUP;
            as-path-transits as-list SAMPLE-AS-LIST-2;
        }
        then accept;
    }
    from {
        as-path-neighbors as-list SAMPLE-AS-LIST;
    }
}
