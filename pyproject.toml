[[tool.template.toolbox.approved]]
name = "uv"
purpose = "the runner every documented command goes through; tests/conftest.py shells out to it under --regen-schema"
minimum-version = "0.12.18"
licence = "Apache-2.0 OR MIT"

[[tool.template.toolbox.approved]]
name = "git"
purpose = "the checks read refs: stage, lane, retired, metrics"
minimum-version = "2.55.0"
licence = "GPL-2.0-only"

[[tool.template.toolbox.approved]]
name = "OpenSSH (ssh, scp)"
purpose = "tests/integration_test.sh drives a live device; run by hand, never by pytest"
minimum-version = "9.0"
licence = "BSD-2-Clause"

[[tool.template.toolbox.rejected]]
name = "markdownlint for document caps"
reason = "its length rules bound a line, not a file, and it cannot read a per-artefact cap from pyproject.toml; no maintained tool enforces declared per-file line budgets, which is why agent-ready-checks owns this one"
date = "2026-09-28"

[[tool.template.toolbox.rejected]]
name = "tach's [[interfaces]] expose on its own"
reason = "it enforces the expose list only against member-path imports; a name reached as `from pkg import mod` then `mod.name` passes whatever the list says, so a codebase that imports modules rather than members has a declared interface that is never enforced. agent-ready-checks covers that half, against the same declaration"
date = "2026-09-30"

[[tool.template.toolbox.rejected]]
name = "import-linter"
reason = "module-to-module only, so it cannot express the public name surface a module contract rests on, and it has no command that derives a first contract set from an existing codebase; it is the documented exit if tach is abandoned"
date = "2026-09-28"

[[tool.template.toolbox.rejected]]
name = "semgrep, Vale, a markdownlint custom rule, or git grep for the retired-terms check"
reason = "the check bans a vocabulary declared per pivot across source, tests, docs, and configuration, with identifier splitting and a per-term occurrence delta; semgrep and a markdownlint rule each read one language, Vale is prose-only and is kept out of the core (AC18), and git grep has no word model and no delta. agent-ready-checks owns it"
date = "2026-10-02"

[[tool.template.toolbox.rejected]]
name = "griffe check alone for the release deprecation rule and the __all__ diff"
reason = "it reports a removal whether or not the name carried the deprecation decorator at the previous tag, and it has no per-ref __all__ diff; both are a few lines on griffe's own load_git API, which is reuse of griffe rather than a replacement for it, and they live in agent-ready-checks"
date = "2026-10-02"

[[tool.template.toolbox.rejected]]
name = "cookiecutter and cruft for the template"
reason = "cookiecutter has no update; cruft adds one as a patch over a fresh render, with rejected hunks as its only conflict handling and no versioned migrations, and neither renders a conditional path, which is how the skeleton stays out of a brownfield repository (AC25)"
date = "2026-10-03"

[[tool.template.toolbox.rejected]]
name = "OpenTelemetry SDK for change metrics import"
reason = "it instruments future events but does not parse existing Codex exec and Claude stream-json files or bind a selected window to an immutable change and exact log hash; agent-ready-checks uses narrow native parsers with stdlib JSON and hashing"
date = "2026-10-06"

