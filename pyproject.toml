[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "junoscfg"
version = "0.22.0"
description = "Convert Junos configurations between XML, JSON, structured, and display set formats"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Manon Goo", email = "manon.goo@dg-i.net" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["junos", "juniper", "network", "configuration", "converter", "validation", "anonymization", "ansible", "set", "json", "xml", "yaml"]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "lark>=1.1",
    "ipanon>=0.3.3",
    "netutils>=1.17.1",
]

[project.optional-dependencies]
xml = ["lxml>=4.9"]

[project.urls]
Homepage = "https://github.com/dg-i/junoscfg"
Repository = "https://github.com/dg-i/junoscfg"
Documentation = "https://github.com/dg-i/junoscfg#readme"
Issues = "https://github.com/dg-i/junoscfg/issues"

[project.scripts]
junoscfg = "junoscfg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "schema: needs a device XSD dump in private_test_data/schemas/; run with --schema",
    "device_grammar: every device set line through the grammar, by hand; run with --device-grammar",
]

# Branch coverage, measured by the full set and CI (`--cov`), not by focused
# runs. `fail_under` is a ratchet: a change that adds coverage raises it, and
# lowering it takes a decision record naming why, as a cap does.
[tool.coverage.run]
branch = true
source_pkgs = ["junoscfg"]

[tool.coverage.report]
fail_under = 91.47
precision = 2

# The stage levers are rendered from [tool.template.stage] into the delimited
# blocks below by `agent-ready render levers`; edit the stage, not a block.
[tool.ruff]
line-length = 100
# The vulture whitelist is a stub file of bare names, not source: ruff reads it
# as useless expressions and undefined names. Both tools ship with the template.
extend-exclude = [".agent-ready/"]
# agent-ready:stage-levers:ruff:begin
target-version = "py310"
# agent-ready:stage-levers:ruff:end

[tool.ruff.lint]
# junoscfg's own families. The stage block below renders `extend-select` from
# the stage on every render, so the repository's set is `select`, named in
# full: `E` and `F` are listed because `select` replaces ruff's defaults.
select = ["E", "F", "W", "I", "N", "B", "A", "SIM", "TCH"]
# agent-ready:stage-levers:select:begin
extend-select = ["FIX", "ERA", "ARG", "BLE", "TID251", "UP", "D1"]
# agent-ready:stage-levers:select:end

[tool.ruff.lint.per-file-ignores]
# Test methods carry their intent in the name; a docstring per test is not a
# convention this project follows, and D1 on tests/ is 1248 of 1306 findings.
# ARG is the same story: a test double implements an interface it does not use.
"tests/**" = ["D1", "ARG"]
# Every rule implements AnonymizeRule.matches(value, schema_node, path) and uses
# only the parameters it needs. The unused ones are the interface, not dead
# arguments; renaming them to _value would break the shared signature.
"src/junoscfg/anonymize/rules/*.py" = ["ARG002"]
# The XSD fix functions share one signature so the fix table can call them
# uniformly; a fix that does not need the tree root still declares it.
"src/junoscfg/validate/xsd_fixes.py" = ["ARG001"]
# The CLI's top-level handlers turn any failure into a message and an exit
# code. That is what a command-line boundary is for; a narrower except would
# let an unexpected error reach the user as a traceback.
"src/junoscfg/cli.py" = ["BLE001", "ARG001"]
# Same boundary argument: a validator converts arbitrary parse failures into a
# ValidationResult rather than crashing the caller that asked "is this valid?".
"src/junoscfg/validate/structured_validator.py" = ["BLE001"]

# agent-ready:stage-levers:tables:begin
[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["D1", "ARG"]  # a test names its intent; a double leaves parameters unused

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"junoscfg.convert.output.xml_output" = { msg = "retired by 2026-10-09-scope-compatibility-to-production-consumer.md; see docs/decisions/2026-10-09-scope-compatibility-to-production-consumer.md" }
"junoscfg.display.ENTRY_KEY_OVERRIDES" = { msg = "retired by 2026-10-09-key-entries-by-declared-identifiers.md; see docs/decisions/2026-10-09-key-entries-by-declared-identifiers.md" }
"junoscfg.display.get_flat_entry_config" = { msg = "retired by 2026-10-09-key-entries-by-declared-identifiers.md; see docs/decisions/2026-10-09-key-entries-by-declared-identifiers.md" }
"junoscfg.display.to_yaml.json_to_yaml" = { msg = "retired by 2026-10-09-scope-compatibility-to-production-consumer.md; see docs/decisions/2026-10-09-scope-compatibility-to-production-consumer.md" }
# agent-ready:stage-levers:tables:end

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.sdist]
exclude = [
    "CLAUDE.md",
    ".claude/",
    "mkdocs.yml",
    "docs/",
    "tests/",
    "uv.lock",
    "/data/",
    # Real operator data: device XSD dumps and cloned corpora. Git ignores it
    # through `private_test_data/.gitignore`, which hatchling does not read, so
    # a local `uv build` packaged 2,627 files into a 98 MB sdist.
    "private_test_data/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/junoscfg"]

[dependency-groups]
# What the suite needs beyond the package and its `xml` extra, so CI can run it
# on every declared interpreter (3.10 included, which the dev tooling does not
# support) from the lock. The dev group includes it.
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
]
dev = [
    {include-group = "test"},
    "lxml>=4.9",
    "ruff>=0.4",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
    "deptry>=0.25.1",
    # Development tooling only. It needs 3.11+, and must not drag the
    # published package's floor up with it.
    "agent-ready-checks>=0.16.1; python_version >= '3.11'",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

# Where a reorganisation lands, as a share of the cap. One ratio for every cap:
# a second line count per cap would double the guessing, and a ratio follows a
# cap that is raised rather than drifting away from it. Nothing enforces it —
# coming back at the cap means coming back here next week.
[tool.template]
reorganise-to = 0.7
# The local fallback when the checks cannot derive a live change's own branch
# point. CI passes the pull request's remote target explicitly.
base = "master"

# The native acceptance leaf. The full set runs this complete committed suite;
# the fast set is governance and pre-commit only. Focused pytest nodes or files
# are the implementation loop.
test-command = ["uv", "run", "--locked", "pytest", "tests/", "-q", "--cov", "--cov-report=term:skip-covered"]

# Budgets what is loaded at session start, not what the repository stores:
# `agent-ready budget` counts AGENTS.md, CLAUDE.md beyond a bridge, every
# skill's name and description, and every command's description.
always-loaded-budget = 4600

# Onboarding completed. agent-ready fields validates this date and, once it is
# set, stops reporting the stage, instruction-file and bridge checks as
# deferred and starts failing on them.
onboarded = 2026-10-06

# A vendored skill is its upstream's: left out of frontmatter, parity, and
# mirror checks, and kept rather than deleted when the mirror regenerates.
vendored-skills = ["openspec-*", ".openspec-*", "source-command-*"]

# Every cap the checks read lives here, and raising one takes a decision record
# naming the measurement that justifies it (AC39).
[tool.template.caps]
"AGENTS.md" = 100
"ARCHITECTURE.md" = 200
"docs/TOOLBOX.md" = 80
"src/**/CONTRACT.md" = 30
# A single-file module's contract sits beside it under the module's own name.
"src/**/*.CONTRACT.md" = 30
"openspec/specs/**/*.md" = 200
"docs/decisions/*.md" = 60
"openspec/changes/*/proposal.md" = 60
"openspec/changes/*/specs/**/*.md" = 100
"openspec/changes/*/design.md" = 80
"openspec/changes/*/retires.md" = 100
"openspec/changes/*/checklist.md" = 20
"openspec/changes/*/docs-plan.md" = 80
".agents/skills/*/SKILL.md" = 300
".agents/skills/*/**/*.md" = 100

# Per-section budgets, read by `agent-ready caps` beside the file caps: inside a
# file the glob matches, the named section may not exceed the line count.
[tool.template.section-caps]
".agents/skills/*/SKILL.md" = { Stage = 10 }

# The compatibility promise, declared by the owner and never deduced. A scaffold
# value fails `agent-ready fields`, as do an unknown name, a missing or passed
# review date, a single named approver, a named surface with no `break-bumps`
# entry or with a component outside `components`, and a lowered `name` that
# arrives without the escape hatch in `stage.md`. `owners` renders into a
# CODEOWNERS rule for this file, so a stage change takes a second human.
[tool.template.stage]
name = "beta"
review-by = "2027-04-06"
owners = ["manon.goo@dg-i.net"]
solo = true                     # one maintainer; drop it when a second owner arrives
surfaces = ["consumer", "cli"]
# https://github.com/dg-i/ansible-collection-junos-config is in production
# against both: its
# render filter imports convert_config, validate_config, Format and
# FieldValidationError, and its pipelines drive `convert`, `edityaml
# rename-root` and `edityaml ansibilize`. See ARCHITECTURE.md section 3.
surface-paths = { consumer = ["src/junoscfg/__init__.py"], cli = ["src/junoscfg/cli.py"] }
# Semver-shaped, pre-1.0. A break on either surface raises the minor, which
# replaces the current patch-bump-for-everything rule in AGENTS.md.
components = ["major", "minor", "patch"]
break-bumps = { consumer = "minor", cli = "minor" }

# Gates enforce by default. A gate installed on an existing codebase that
# cannot pass it starts in warn mode against a committed baseline, which is how
# an imperfect project adopts the gate on the day it arrives rather than after a
# cleanup. The gates with a baseline are caps, interfaces, specs, and reconcile;
# the other checks have no debt to carry, and `agent-ready gates` rejects a
# gate declared under any other name:
#
#   [tool.template.gates.caps]
#   mode = "warn"
#   expires = "2026-12-31"
#   baseline = ".agent-ready/caps.json"
#
# Write the baseline with `agent-ready caps --write-baseline`. A violation absent
# from the baseline fails from day one in either mode, a baselined violation that
# gets worse fails, and every tolerated violation starts failing once the expiry
# passes. Warn mode without an expiry is a configuration error, so a warn period
# is always one somebody has to end.

# What to move first when a document is over its cap. The generic ladder is in
# the failure message; these are the rungs that differ by artefact.
[tool.template.caps-remedy]
"AGENTS.md" = "move pointer targets into the files they point at; only the rule that matters most stays"
"ARCHITECTURE.md" = "sections 4 to 7 and 9 to 12 are optional; a fact that changes at a different cadence belongs in the toolbox or a decision record"
"src/**/CONTRACT.md" = "move interface facts back to __all__; drop an invariant that names no check"
"src/**/*.CONTRACT.md" = "move interface facts back to __all__; drop an invariant that names no check"
"openspec/specs/**/*.md" = "split by capability into a directory under the domain's, never truncate"
"docs/decisions/*.md" = "a decision states what was decided and what enforces it; the debate belongs in the pull request"

# Measured and printed, never failed: skills a vendored CLI installs, since
# rewriting one forks it, and the generated decisions index, which grows with
# the records it lists.
[tool.template.caps-report-only]
".agents/skills/openspec-*/SKILL.md" = 300
"docs/decisions/index.md" = 60

# Approved tools, and what was considered and rejected. An entry without a
# licence fails the check, because the licence decision is made from this table.
".agents/skills/agent-ready-*/SKILL.md" = 300
".agents/skills/agent-ready-*/*.md" = 100
".agents/skills/agent-ready-*/**/*.md" = 100
