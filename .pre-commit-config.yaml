# The fast set, and the tests a commit affects. Everything slower runs in CI. The hook repositories are pinned
# and `pre-commit autoupdate` moves them; the checks that read the project's
# own dependencies run through its environment with `uv run --locked --group dev`, so
# a new dependency never needs an edit here. The file is this repository's
# from the first copy: `copier update` never touches it, and `agent-ready
# phase 4 may write it where it is missing or merge the template's
# hooks for a repository that merges them into hooks of its own.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      # The type hook takes the whole package. Checking only the changed files
      # misses every caller of what changed, which is the drift it exists to
      # catch; passing filenames also lets pre-commit split them across
      # processes, and parallel mypy processes contend on one cache.
      - id: deptry
        name: deptry
        entry: uv run --locked --group dev deptry src
        language: system
        pass_filenames: false
        always_run: true

      # Tests reach the product through the doors tach.toml declares; see
      # tests/CONTRACT.md. Whole tree: an export removed from a door breaks a
      # test that never changed.
      - id: test-doors
        name: test doors
        entry: uv run --locked --group dev python tools/check_test_doors.py
        language: system
        files: ^(tests/.*\.py|tach\.toml|src/junoscfg/.*__init__\.py)$
        pass_filenames: false

      # The tests the staged files can break: tests/unit/ of each package
      # touched and of every package importing it, plus tests/contract/; shared
      # ground runs the whole default suite. tools/affected_tests.py says why.
      # It reads the staged files from git itself, so a `--all-files` run (the
      # agent-ready check sets) selects the branch's change, not every file.
      - id: affected-tests
        name: affected tests
        entry: uv run --locked --group dev python tools/affected_tests.py --run
        language: system
        files: ^(src/|tests/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
        require_serial: true

      # The check package is pinned by uv.lock, so the hook runs the project's
      # own copy rather than installing a second one here.
      - id: caps
        name: document caps
        entry: uv run --locked --group dev agent-ready caps
        language: system
        types_or: [markdown]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        # MD046 fires on fenced blocks indented inside mkdocs-material
        # content tabs (=== "CLI"), which are not indented code blocks.
        # MD041 (first line must be an h1) is disabled because every artefact
        # the agent-ready schema templates produce starts at `## `. That is the
        # only rule those files break, so the rest still apply to them.
        args: ["--disable", "MD013", "MD033", "MD046", "MD041", "--"]
        # the schema's artefact templates are comment-led fragments, not documents
        # CLAUDE.md must be exactly the one-line bridge `@AGENTS.md`, which
        # agent-ready fields enforces and MD041 (first line must be an h1)
        # rejects. The bridge wins: it is a loader directive, not a document.
        # changelog.d holds towncrier fragments: one sentence each, no h1.
        # Vendored skills belong to their upstream; pyproject declares them
        # under vendored-skills and we do not reformat someone else's docs.
        exclude: ^(openspec/(schemas|changes|specs)/|\.agents/skills/openspec-|CLAUDE\.md$)
