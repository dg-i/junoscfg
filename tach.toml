# The module boundaries. `tach sync` derives the modules and layers from the
# imports in onboarding phase 4 and nowhere else: outside bootstrap it is out of
# the agent's reach, because widening a boundary is a human decision under
# review. A freshness diff in CI catches hand edits.
source_roots = ["src"]
exclude = ["tests", "docs"]
forbid_circular_dependencies = true
ignore_type_checking_imports = true

# Modules mirror the zone table. `tach sync` fills depends_on from the real
# imports; the layer order is the DAG ARCHITECTURE.md section 8 records.
layers = ["surface", "feature", "pipeline", "kernel"]

[[modules]]
path = "junoscfg"
layer = "surface"

[[modules]]
path = "junoscfg.cli"
layer = "surface"
depends_on = ["junoscfg"]

[[modules]]
path = "junoscfg.audit"
layer = "feature"

[[modules]]
path = "junoscfg.edityaml"
layer = "feature"

[[modules]]
path = "junoscfg.convert"
layer = "pipeline"
depends_on = ["junoscfg.anonymize"]

[[modules]]
path = "junoscfg.validate"
layer = "pipeline"

[[modules]]
path = "junoscfg.anonymize"
layer = "pipeline"

[[modules]]
path = "junoscfg.display"
layer = "kernel"
depends_on = ["junoscfg.input"]

[[modules]]
path = "junoscfg.input"
layer = "kernel"

# The interfaces. `expose` is derived from observed cross-module usage, not from
# __all__, which covers 4 of 68 modules here. agent-ready interfaces holds the
# two in step: the list and the module's own __all__ must agree.

[[interfaces]]
from = ["junoscfg.display"]
expose = [
    "ConfigStore", "ENTRY_KEY_OVERRIDES", "INTEGER_TYPES", "KEY_ALIASES", "SetConverter",
    "UNIVERSAL_STATEMENTS", "UNQUOTABLE_TYPES",
    "artifacts_dir",
    "filter_json_by_path", "filter_set_by_path", "filter_structured_by_path",
    "filter_yaml_by_path", "enum_is_fragment", "find_artifact",
    "format_value",
    "get_flat_entry_config", "get_transparent_child", "is_display_set",
    "is_flat_dict", "is_freeform_nk", "is_positional_key",
    "is_transparent_list_key", "load_schema_tree", "open_artifact_write",
    "read_artifact_text", "resolve_artifacts_dir", "resolve_key_alias",
    "statement_name_spellings", "strip_type_prefix", "xml_to_yaml",
]

[[interfaces]]
from = ["junoscfg.input"]
expose = ["find_unsupported_set_brackets", "iter_visible_set_lines", "normalize"]

[[interfaces]]
from = ["junoscfg.validate"]
expose = [
    "ArtifactBuilder", "JunosValidator", "SchemaLoadError", "ValidationError",
    "ValidationResult",
]

[[interfaces]]
from = ["junoscfg.anonymize"]
expose = [
    "AnonymizeConfig", "AnonymizeResult", "anonymize", "apply_revert",
    "build_config_from_cli", "export_mapping", "load_mapping",
]

[[interfaces]]
from = ["junoscfg.convert"]
expose = [
    "FieldValidationError", "find_configuration", "from_dict", "pipeline",
    "to_dict", "validate_ir",
]
