# The module boundaries. `tach sync` derives the modules and layers from the
# imports in onboarding phase 4 and nowhere else: outside bootstrap it is out of
# the agent's reach, because widening a boundary is a human decision under
# review. A freshness diff in CI catches hand edits.
source_roots = ["src"]
exclude = ["tests", "docs"]
forbid_circular_dependencies = true
ignore_type_checking_imports = true

# Modules mirror the zone table. `tach sync` fills depends_on from the real
# imports; the layer order is the DAG ARCHITECTURE.md section 8 records.
layers = ["surface", "feature", "pipeline", "kernel"]

[[modules]]
path = "junoscfg"
layer = "surface"

[[modules]]
path = "junoscfg.cli"
layer = "surface"
depends_on = ["junoscfg"]

[[modules]]
path = "junoscfg.audit"
layer = "feature"

[[modules]]
path = "junoscfg.edityaml"
layer = "feature"

[[modules]]
path = "junoscfg.convert"
layer = "pipeline"
depends_on = ["junoscfg.anonymize"]

[[modules]]
path = "junoscfg.validate"
layer = "pipeline"

[[modules]]
path = "junoscfg.anonymize"
layer = "pipeline"

[[modules]]
path = "junoscfg.display"
layer = "kernel"
depends_on = ["junoscfg.input"]

[[modules]]
path = "junoscfg.input"
layer = "kernel"

# The interfaces. `expose` is derived from observed cross-module usage, not from
# __all__, which covers 4 of 68 modules here. agent-ready interfaces holds the
# two in step: the list and the module's own __all__ must agree.

[[interfaces]]
from = ["junoscfg.display"]
expose = [
    "AUDIT_FORMATS", "CONVERSION_FORMATS", "VALIDATION_FORMATS",
    "ConfigStore", "INTEGER_TYPES", "KEY_ALIASES", "SetConverter",
    "UNIVERSAL_STATEMENTS", "UNPLACED_STATEMENTS", "UNQUOTABLE_TYPES",
    "artifacts_dir", "build_from_artifact",
    "filter_dict_by_path", "filter_json_by_path", "filter_set_by_path", "filter_structured_by_path",
    "filter_yaml_by_path", "entry_key_names", "entry_keys", "enum_is_fragment", "find_artifact",
    "forget_loaded_artifacts", "detect_format", "format_value",
    "get_transparent_child", "holds_tag", "is_display_set",
    "is_flat_dict", "is_freeform_nk", "is_positional_key", "key_is_positional",
    "is_transparent_list_key", "load_schema_tree", "open_artifact_write", "passes_tag_to_child",
    "read_artifact_text", "resolve_artifacts_dir", "resolve_key_alias",
    "statement_children", "statement_name_spellings", "strip_type_prefix", "unplaced_record_problem",
    "xml_to_dict",
    "xml_to_yaml",
]

[[interfaces]]
from = ["junoscfg.input"]
expose = ["find_unsupported_set_brackets", "iter_visible_set_lines", "normalize"]

[[interfaces]]
from = ["junoscfg.validate"]
expose = [
    "ALL_FIXES", "ArtifactBuilder", "Combinator", "JsonYamlValidator", "JunosValidator",
    "SchemaLoadError", "SchemaNode", "SetValidator", "StructuredValidator", "ValidationError",
    "ValidationResult", "XmlValidator", "XsdFix", "apply_all_fixes", "extract_xsd", "find_all",
    "generate_json_schema", "generate_lark_grammar", "get_fix_count", "navigate", "parse_xsd",
    "read_structure_tree", "walk", "write_json_schema", "write_lark_grammar",
    "write_structure_tree",
]

[[interfaces]]
from = ["junoscfg.anonymize"]
expose = [
    "AnonymizeConfig", "AnonymizeResult", "AsNumberRule", "CommunityRule", "DescriptionRule",
    "GroupRule", "IdentityRule", "IpRule", "PasswordRule", "PathFilter", "Rule",
    "SensitiveWordRule", "SshKeyRule", "anonymize", "apply_revert", "build_config_from_cli",
    "build_rules", "export_mapping", "load_mapping", "walk",
]

[[interfaces]]
from = ["junoscfg.convert"]
expose = [
    "ConversionResult", "Diagnostic", "FieldError", "FieldValidationError", "FieldValidationResult",
    "StructuredSetLines", "UNPLACED", "find_configuration", "from_dict", "pipeline",
    "pipeline_result", "structured_set_lines", "to_dict", "validate_ir",
]
