name: corpus

# The opt-in evidence tier the pull-request checks leave out: Juniper's public
# jvd corpus, cloned at run time (tests/support/jvd_data.py). The --schema tier
# needs a device dump that cannot be committed, so it stays a local run.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  jvd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --no-dev --group test --extra xml pytest tests/corpus/ --jvd -q
