name: checks

on:
  pull_request:
  push:
    branches: [master]

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  # The tested interpreters are derived from pyproject.toml, not listed here,
  # so supporting a new Python means adding the classifier you would add
  # anyway. A floor that disagrees with the classifiers fails the job.
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.derive.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: derive
        shell: python
        run: |
          import json, os, re, tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]

          declared = sorted(
              (
                  tuple(int(part) for part in match.group(1).split("."))
                  for classifier in project["classifiers"]
                  if (match := re.fullmatch(r"Programming Language :: Python :: (\d+\.\d+)", classifier))
              )
          )
          if not declared:
              raise SystemExit("no 'Programming Language :: Python :: X.Y' classifiers to test")

          floor = re.search(r">=\s*(\d+)\.(\d+)", project["requires-python"])
          if not floor:
              raise SystemExit(f"cannot read a floor from requires-python {project['requires-python']!r}")
          expected = (int(floor.group(1)), int(floor.group(2)))
          if declared[0] != expected:
              raise SystemExit(
                  f"requires-python floor is {expected[0]}.{expected[1]} but the lowest "
                  f"classifier is {declared[0][0]}.{declared[0][1]}; they must agree"
              )

          versions = [f"{major}.{minor}" for major, minor in declared]
          print(f"testing on: {', '.join(versions)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"list={json.dumps(versions)}\n")

  # The suite only. Cheap enough to run on every declared interpreter; the
  # gates below are interpreter-independent and run once.
  tests:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.list) }}
    name: tests (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --python ${{ matrix.python }} --with pytest --with lxml --no-dev pytest tests/ -q

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # This repository's default branch is master, so the template's
      # origin/main fallback would resolve to nothing.
      - run: uv run --locked --group dev --with griffe --with tach --with towncrier --with vulture agent-ready check --set full --base origin/${{ github.base_ref || 'master' }}

      # Enforced at stable package doors and caller-visible models; dynamic
      # Junos-tree internals remain under behavioral tests.
      - name: mypy (stable interfaces)
        if: always()
        run: >-
          uv run --locked --group dev mypy --follow-imports=silent
          src/junoscfg/__init__.py
          src/junoscfg/convert/__init__.py
          src/junoscfg/validate/__init__.py
          src/junoscfg/anonymize/__init__.py
          src/junoscfg/anonymize/config.py
          src/junoscfg/audit/__init__.py
          src/junoscfg/audit/model.py
