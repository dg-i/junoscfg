# The change folder, as OpenSpec tracks it. A fork of OpenSpec's spec-driven
# schema carrying the artefacts the workflow adds; `openspec schema validate
# agent-ready` checks it, and the template re-validates it on each OpenSpec
# upgrade, since schema commands are marked experimental.
name: agent-ready
version: 1
description: The agent-ready change, proposal to metrics
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why the change, what changes, which capabilities, and the non-goals; the lane fields sit in .openspec.yaml
    template: proposal.md
    instruction: |
      Write the Why and What Changes sections, the capabilities, and the
      non-goals. Ten to thirty lines. A capability path is
      <domain>/<capability>, the domain being a key of [tool.template.domains].
      The fields the lane gate reads go in .openspec.yaml beside this file:
      `type`, `zone`, `domains`, `removes` on the standard lane, which may read
      "none, because ...", and in beta and release `declared-break`, one entry
      per named surface the change touches with its `why` and `migration`. A
      change with no spec-level behaviour change sets `skip_specs: true` there
      rather than inventing a requirement.
    requires: []

  - id: codemap
    generates: codemap.md
    description: The code-map slice, modules ranked by the paths the proposal names
    template: codemap.md
    instruction: |
      Generated by `agent-ready codemap slice --change <slug>` from the symbol
      index, ranked by the paths the proposal's domains name and cut at 1,500
      tokens. Never written by hand.
    requires: [proposal]

  - id: specs
    generates: "specs/**/*.md"
    description: Delta specs, one per capability the proposal names
    template: spec.md
    instruction: |
      One file per capability at specs/<domain>/<capability>/spec.md, the exact
      path under openspec/specs/. ADDED, MODIFIED, REMOVED, and RENAMED sections
      only. Every requirement is EARS-shaped, carries at least one scenario, and
      names an acceptance test id. A MODIFIED block carries the whole
      requirement, every scenario included. Lite spec is the default.
    requires: [proposal, codemap]

  - id: design
    generates: design.md
    description: Design and the reuse ladder, for the types that require one
    template: design.md
    instruction: |
      Required for feature and new-dependency. Walk the reuse ladder in order
      and list at most three candidates, one line each. Decisions, not options.
    requires: [proposal]

  - id: tasks
    generates: tasks.md
    description: Implementation checklist the implement phase ticks
    template: tasks.md
    instruction: |
      Tests first, then the implementation against them. Tick each task as it
      lands, so an interrupted session resumes here.
    requires: [specs]

  - id: retires
    generates: retires.md
    description: What a pivot retires - terms, symbols, dependencies, requirements, tests, docs
    template: retires.md
    instruction: |
      Pivot changes only. Terms go in the delimited block, and `agent-ready
      retired` prints each term's occurrence count beside it for the human who
      approves the proposal.
    requires: [proposal]

  - id: checklist
    generates: checklist.md
    description: The advisory half of a stage-up, one line per item with the owner's answer
    template: checklist.md
    instruction: |
      Stage-up changes only. One line per advisory item carrying the owner's
      answer, so the garden audits a file rather than re-deriving a judgment.
    requires: [proposal]

  - id: review
    generates: review.md
    description: The agent review report, written in a fresh session
    template: review.md
    instruction: |
      Findings that affect correctness or violate a contract, ranked, and
      anything the toolbox, the standard library, or a declared dependency
      already provides. The reviewer edits nothing.
    requires: [tasks]

  - id: metrics
    generates: metrics.md
    description: The readable metrics record, captured before merge alongside metrics.json
    template: metrics.md
    instruction: |
      Capture with full base and code-head commit IDs before merge and archive.
      The adjacent metrics.json carries per-field evidence and provenance.
      Unavailable evidence stays UNMEASURED, never an estimate.
    requires: [tasks]

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the module's contract and the code-map slice before touching it, read
    a named symbol with `agent-ready codemap show <pkg.mod.symbol>` rather than
    the file around it, and run the checks. After two consecutive failures of
    the same check or test, stop and report.
