# Maintained by the agent-ready template. Local edits can conflict with updates.
# See docs/how-to/template-ownership.md before editing; review every update diff.
# The change folder, as OpenSpec tracks it. A fork of OpenSpec's spec-driven
# schema carrying the artefacts the workflow adds; `openspec schema validate
# agent-ready` checks it, and the template re-validates it on each OpenSpec
# upgrade, since schema commands are marked experimental.
name: agent-ready
version: 1
description: The agent-ready change, proposal to metrics
artifacts:
  - id: instruction-integrity
    generates: instruction-integrity.md
    description: Effective instruction stack, conflicts, assurance preference, and owner decision batch
    template: instruction-integrity.md
    instruction: |
      Complete before proposal work. Inventory the complete effective
      instruction stack, classify every conflict using the six workflow
      classes, report the effect of likely-defective higher-priority
      instructions while obeying them. Select the strongest matching standing
      preference from [tool.template.assurance], cite its record and matched
      keys, and copy its economy, balanced, or maximum-assurance value to
      .openspec.yaml. Ask only when no standing rule matches.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Why the change, what changes, which capabilities, and the non-goals; the lane fields sit in .openspec.yaml
    template: proposal.md
    instruction: |
      Write the Why and What Changes sections, the capabilities, and the
      non-goals. Ten to thirty lines. A capability path is
      <domain>/<capability>, the domain being a key of [tool.template.domains].
      The fields the lane gate reads go in .openspec.yaml beside this file:
      `type`, `zone`, `domains`, `removes` on the standard lane, and the
      standing owner `assurance` selected in phase 0 on every lane. `removes` may read
      "none, because ...", and in beta and release `declared-break`, one entry
      per named surface the change touches with its `why` and `migration`,
      shaped `declared-break: {api: {why: ..., migration: ...}}`. A
      change with no spec-level behaviour change sets `skip_specs: true` there
      rather than inventing a requirement. Type `docs` also creates
      `docs-plan.md` from its conditional template and does not treat the
      type-blind codemap and specs graph entries as obligations. Types `fix`
      and `maintenance` use the short routes in `agent-ready-change`: both have
      a ten-line proposal and no delta; fix adds a pre-fix regression, while
      maintenance names preservation evidence and a changelog decision.
    requires: [instruction-integrity]

  - id: codemap
    generates: codemap.md
    description: The code-map slice, modules ranked by the paths the proposal names
    template: codemap.md
    instruction: |
      Generated by `uv run --locked --group dev agent-ready codemap slice
      --change <slug>` from the symbol index, ranked by the paths the proposal's
      domains name and cut at 1,500 tokens. Never written by hand.
    requires: [proposal]

  - id: specs
    generates: "specs/**/*.md"
    description: Delta specs, one per capability the proposal names
    template: spec.md
    instruction: |
      One file per capability at specs/<domain>/<capability>/spec.md, the exact
      path under openspec/specs/. ADDED, MODIFIED, REMOVED, and RENAMED sections
      only. Every requirement is EARS-shaped, carries at least one scenario, and
      names an acceptance test id. A MODIFIED block carries the whole
      requirement, every scenario included. Lite spec is the default.
    requires: [proposal, codemap]

  - id: tasks
    generates: tasks.md
    description: Implementation checklist the implement phase ticks
    template: tasks.md
    instruction: |
      Verification first, then the change against it. Code changes use reviewed
      acceptance tests and implementation tasks. Type `docs` uses the approved
      checks from docs-plan.md and documentation tasks. Keep the shipped review
      and metrics lifecycle tasks open until those phases complete, so the
      pre-review lane check does not demand artifacts that do not exist yet.
    requires: [specs, evidence-freeze]

  - id: evidence-freeze
    generates: evidence-freeze.md
    description: Frozen instructions, requirements, evidence, non-goals, criteria, performance expectations, and decisions
    template: evidence-freeze.md
    instruction: |
      Complete at the end of specification. It is the execution baseline.
      Later instructions or evidence require a recorded delta consistency
      check before affected work continues.
    requires: [proposal]

  # Conditional files are not artifacts here: the graph has no per-type
  # artifact, so listing them makes `status` ask every change for all of them.
  # The design, retires, and checklist templates stay in templates/; the lane
  # gate and the relevant phase or type body require them.
  - id: review
    generates: review.md
    description: The fresh isolated review verdict
    template: review.md
    instruction: |
      A fresh isolated Reviewer records findings and a verdict under the role
      policy in agent-ready-change. Review is required on every lane; application
      policy may add controls. The Reviewer edits no product files.
    requires: [tasks]

  - id: metrics
    generates: metrics.md
    description: The readable metrics record, captured before merge alongside metrics.json
    template: metrics.md
    instruction: |
      Capture with full base and code-head commit IDs before merge and archive.
      The adjacent metrics.json carries per-field evidence and provenance.
      Unavailable evidence stays UNMEASURED, never an estimate.
    requires: [proposal]

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read the module's contract and the code-map slice before touching it. Start
    a named lookup with `uv run --locked --group dev agent-ready codemap show
    <pkg.mod.symbol>`; read its containing module, direct callers and
    dependencies, and affected tests when control flow or shared state require
    them. Run the canonical full check from `agent-ready-change`. Stop when the
    same failure repeats without new evidence or a changed hypothesis; continue
    evidence-driven attempts that narrow the cause.
