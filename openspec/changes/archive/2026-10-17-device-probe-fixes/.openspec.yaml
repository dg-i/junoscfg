schema: agent-ready
created: 2026-10-17
assurance: economy
type: bug
zone: conversion
domains: [conversion, validation, schema-pipeline]
removes: >-
  relative set output's bare verb lines (`deactivate`, `protect`, `activate`, `delete` with no
  path), which the device refuses (probe SC1); structured output's own count of a relative
  selection's dropped tags, replaced by the one rule every writer shares; the set reader's
  private meta-command walk, tokenizer and key reader, moved read-only into the kernel
  (`junoscfg.display.meta_target`, `junoscfg.input.set_tokens`) so set validation decides what
  a verb line names by the same walk; the set reader's whole-list tag on a list the XSD does not
  mark homogeneous (the device refuses it, probe D5) with the two catalogue shapes that pinned
  it; the grammar's rule-name escapes `eq_literal`, `plus_literal` and `minus_literal` as
  keywords
declared-break:
  consumer:
    why: >-
      Not a break. validate_config and convert_config(_result) keep their signatures and
      names; set input is what a device exports (decision 2026-10-17-set-input-is-a-device-export)
      and every line of the committed device captures converts and validates as before (the
      before/after comparison: 0 of 96 conversions differ). (a) Set validation of a non-set verb
      line refuses a line that stops at the keyword of a list the XSD does not mark
      homogeneous without its entry's name, names a leaf's value or one value of a leaf-list, or
      stops inside an entry's key, where it said valid: the QFX5120 refuses the first two
      (probe D5 and A2). (b) The set reader refuses the first two with ValueError naming them
      ("Metadata commands cannot target a list without its entry's name"; a leaf's value was
      refused already), where it tagged the whole list and wrote back the line the device
      refuses; a tag on `family` itself, which the device refuses under `interfaces … unit`
      ("missing argument"; elsewhere by extension, and the 16 `tunnel encapsulation` nodes of
      the same rule without device evidence, device question 12), is invalid for `-v`, and set output drops it with the note structured output gives, where it
      wrote the line back. The homogeneous-list reading rests on the owner ruling of 2026-10-17
      on review S-6, with device questions 6 and 7 as its carried checkpoint. A verb line
      validated against an artifacts directory without a structure tree raises SchemaLoadError
      ("a verb line is judged by the structure tree"); every artifact set junoscfg builds holds
      the tree. (c) `-v` takes `then community = | + | -`, as the device writes it, and no
      longer the misspellings `eq_literal`, `plus_literal`, `minus_literal`; it reports a line
      holding several statements that each stand alone as "Unsupported in set input, one
      statement a line" where it said "Invalid syntax". (d) An absolute path= selection keeps
      the annotations along its path, so a statement inside a deactivated container is
      written inside it, as the device prints it (probe C3), where it was written active. (e)
      A relative path= selection drops a tag at or above its path with one note, in every
      format, where set wrote a bare verb the device refuses (probe SC1); json, yaml-new and
      yaml note a comment they drop there. (f) Set and
      structured output note a per-value leaf-list tag; notes carry the writer's name as their
      source. (g) Five statements the device takes undocumented now validate. Output changes
      only where it loaded with another meaning or did not load. Patch, as AGENTS.md rules for
      everything that is not a break.
    migration: >-
      None for a device export. A hand-written verb line that names a value or the keyword of
      such a list is written as the device takes it: the statement path alone
      (`deactivate system host-name`) or each entry with its name. A script comparing --path
      output, validation messages or diagnostics updates its expected text.
  cli:
    why: >-
      Not a break, for the reasons given for consumer: junoscfg -v, --path and --relative keep
      their options and exit codes; -v exits 1 only for lines the device refuses or no export
      holds, conversion exits 2 for a verb on such a list's keyword as for a leaf's value, and
      conversion prints a note where it drops a tag.
    migration: >-
      None for a device export; write a refused verb line as the device takes it, and update a
      script that compares the text.
