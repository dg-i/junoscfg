schema: agent-ready
created: 2026-10-11
type: bug
zone: kernel
domains: [conversion, validation]
removes:
  - "the line-oriented curly reader (`SetConverter._process` with `_strip_inline_comments` and `_parse_bracket_expansion`), replaced by one token lexer"
  - "the known-differences class `omitted-block-emitted`, whose lines the fix removes"
  - "nothing public: `SetConverter.to_set()`, `StructuredValidator` and `JunosValidator.validate_structured()` are deprecated, not removed, because beta removes a door only after a deprecation"
assurance: balanced
declared-break:
  consumer:
    why: >-
      No name or signature changes. The surface file changes `__version__`
      (0.15.3 to 0.16.0) and `validate_structured`, which `validate_config`
      calls for structured input. Behind it, convert_config from structured
      input converts a block written on one line, which it returned empty;
      raises ValueError for unbalanced braces or brackets, a statement without
      `;` or an open quote or comment, which it read past; and reports the
      device's `{ /* OMITTED */ }` placeholder and an empty block as warnings
      instead of writing them. validate_config and validate_structured check a
      one-line curly statement as conversion reads it, so the device's
      `hold-time up 2000 down 0;` and `protect:` lines validate, and a one-line
      block is validated instead of passing as empty. Declared breaks on a
      named surface raise the minor (AGENTS.md; instruction-integrity C7).
    migration: >-
      None for input a device loads. A caller that passed malformed curly text
      gets ValueError (convert) or an invalid result (validate) and fixes the
      text.
  cli:
    why: >-
      `junoscfg convert -i structured` gives the corrected results above and
      prints the reader's warnings; `-v` validates as validate_config does;
      `junoscfg audit unused` prints the reader's warnings to stderr.
      Malformed curly input now exits with the conversion error status instead
      of succeeding.
    migration: None for input a device loads; fix malformed input.
