schema: agent-ready
created: 2026-10-16
assurance: economy
type: bug
zone: conversion
domains: [conversion, validation]
removes: >-
  the `yaml` reader's and validator's walk of a mapping key that is not a string (it crashed
  in the meta-key cleanup or in jsonschema, so nothing it accepted is lost); with it
  `find_non_json_value`'s naming of such a key by its kind inside a path, which no refusal
  reaches once every key is a string; and JSON and XML input's unbounded nesting, which
  crashed junoscfg's own walks (or the PyYAML dump they feed) with RecursionError
declared-break:
  consumer:
    why: >-
      Not a break. convert_config, convert_config_result and validate_config change only
      where they crashed or wrote a different configuration: a `yaml` document holding a
      mapping key that is not a string raises ValueError (validation reports it invalid)
      where it raised AttributeError or TypeError; JSON or XML nested deeper than 64 levels
      raises ValueError where junoscfg raised RecursionError (JSON from about 450 levels, a
      repeated XML element from about 164) and JSON validation reports it invalid where it
      judged it valid (no Junos configuration nests past 26; the device corpus nests 17); and an absolute path= ending
      at a leaf or a leaf-list keeps that statement's tags, as the parent selection writes
      them, where it dropped them and wrote the statement active. No signature, name or
      accepted configuration changes on the named surface. Patch, as AGENTS.md rules for
      everything that is not a break.
    migration: >-
      None required. A caller relying on a key that is not a string in a `yaml` file quotes
      it (`'64496':`), as junoscfg's own `yaml` writer always writes keys; a script comparing
      the text of an absolute leaf selection updates its expected output, which now holds
      the leaf's tags.
  cli:
    why: >-
      Not a break, for the reasons given for consumer: junoscfg convert exits 2 with an
      "Invalid input" message where it printed a traceback, and --path keeps a selected
      leaf's tags; options and exit codes are unchanged.
    migration: None required; a script comparing the text updates its expected output.
