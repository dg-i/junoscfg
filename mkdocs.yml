site_name: Junoscfg
site_description: Convert and validate Junos configurations between formats
repo_url: https://github.com/dg-i/junoscfg

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate

not_in_nav: |
  /decisions/20*.md
  /reviews/*.md
  /roadmaps/*.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Conversion: guide/conversion.md
      - Operational Attributes (@): guide/annotations.md
      - Validation: guide/validation.md
      - Unused-Object Audit: guide/audit.md
      - Edit YAML (Ansible): edityaml.md
      - CLI Guide: guide/cli.md
      - CLI Command Reference: guide/cli-reference.md
  - API Reference:
      - Overview: api/index.md
      - junoscfg: api/conversion.md
      - junoscfg.convert: api/convert.md
      - junoscfg.display: api/display.md
      - junoscfg.input: api/input.md
      - junoscfg.validate: api/validate.md
      - junoscfg.anonymize: api/anonymize.md
      - junoscfg.audit: api/audit.md
  - Architecture:
      - Developer Guide: architecture/developer-guide.md
      - Design Decisions: architecture/design-decisions.md
      - Schema Internals: architecture/schema-internals.md
      - Conversion Bugfix Guide: architecture/conversion-bugfix-guide.md
  - Toolbox: TOOLBOX.md
  - Decisions: decisions/index.md
  - Working with Agents:
      - Work with Agents: how-to/work-with-agents.md
      - Settle a Schema Question: how-to/settle-a-schema-question.md
      - Solo Review: how-to/solo-review.md
      - Run a Batch of Changes: how-to/run-a-batch-of-changes.md
      - Capture Change Metrics: how-to/capture-change-metrics.md
      - Observe Artifact Readership: how-to/observe-artifact-readership.md
      - Observe OpenSpec Readership: how-to/observe-openspec-readership.md
      - Lifecycle Events: how-to/lifecycle-ledger.md
      - Verification Evidence: how-to/verification-evidence.md
      - Parallel Verification: how-to/parallel-verification.md
      - Junoscfg Verification: how-to/junoscfg-verification.md
      - Verification Baseline: VERIFICATION.md
      - Improve Verification: how-to/improve-verification.md
      - Remove agent-ready: how-to/remove-agent-ready.md

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
