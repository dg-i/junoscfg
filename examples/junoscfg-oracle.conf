/* junoscfg-oracle: the configuration junoscfg is judged against. Every Junos
construct its converters must carry through set, curly, XML and JSON
(groups, wildcards, apply-*, tags, annotations, quoting, keyed entries, the
statements a schema cannot place), routing and system material for the
anonymizer, and an ELS switching section. Written for junoscfg; values are
its test-data conventions (AS 64496-64511; 10.x, 192.168.x and 198.51.100.x
kept; 203.0.114.x, 198.0.2.x and 3ffe:b00::/32 anonymized). Its secrets are
invented and public. Loaded on lab devices in configure private and rolled
back there; the devices' renderings of it are the test oracle.
The switching (ELS) section uses interfaces of its own (xe-*, ae1, irb.110).
A device that refuses a statement drops the rest of its enclosing block,
so each platform's renderings show what that platform keeps. */
groups {
    GR-SYSTEM {
        system {
            host-name router1;
            domain-name example.net;
            time-zone Europe/Berlin;
            ntp {
                server 198.51.100.123 prefer;
            }
        }
    }
    GR-EDGE-INTF {
        interfaces {
            <ge-*> {
                description "set by GR-EDGE-INTF";
                mtu 9192;
                unit <*> {
                    family inet {
                        mtu 1500;
                    }
                }
            }
            "<[gx]e-*>" {
                hold-time up 2000 down 0;
            }
        }
    }
    GR-BGP {
        protocols {
            bgp {
                group <*> {
                    hold-time 30;
                    inactive: log-updown;
                }
            }
        }
    }
    GR-VRF {
        routing-instances {
            <VRF-*> {
                vrf-table-label;
            }
        }
    }
    GR-MACRO {
        protocols {
            ospf {
                apply-macro GR-PARAMS {
                    bfd;
                    metric 10;
                }
            }
        }
    }
    GR-ISIS-TPL {
        protocols {
            isis {
                interface <ge-*> {
                    hello-padding strict;
                    inactive: max-hello-size 9000;
                }
            }
        }
    }
    GR-ACCESS-PORT {
        interfaces {
            <xe-0/0/1*> {
                unit 0 {
                    ##
                    ## Warning: configuration block ignored: unsupported platform (vmx)
                    ##
                    family ethernet-switching {
                        interface-mode access;
                        storm-control SC-DEFAULT;
                    }
                }
            }
        }
    }
    /* apply-flags omit hides a statement's content in curly output; a group
    of its own, not applied, so nothing else is hidden */
    GR-OMIT {
        system { /* OMITTED */ };
    }
    inactive: GR-UNUSED {
        system {
            location building "B 2";
        }
    }
    protect: GR-PROTECTED {
        snmp {
            location "rack 4, row B";
        }
    }
}
apply-groups [ GR-SYSTEM GR-EDGE-INTF GR-BGP GR-VRF GR-PROTECTED GR-ACCESS-PORT ];
