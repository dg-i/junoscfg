policy-options {
    prefix-list PL-BGP-PEERS {
        apply-path "protocols bgp group <*> neighbor <*>";
    }
    prefix-list PL-MGMT {
        10.0.0.0/8;
        198.51.100.0/24;
    }
    prefix-list PL-MGMT6 {
        2001:db8::/32;
    }
    route-filter-list RFL-DEFAULT {
        0.0.0.0/0 exact;
        10.0.0.0/8 orlonger;
    }
    route-filter-list RFL-MIXED {
        10.10.0.0/18 upto /32;
        10.12.0.0/16 orlonger;
        0.0.0.0/0 prefix-length-range /1-/32;
        198.51.100.0/24 exact;
        2001:db8::/32 orlonger;
    }
    policy-statement P-A {
        term NEXT {
            from protocol bgp;
            then {
                local-preference 200;
                next term;
            }
        }
        term ACCEPT {
            then accept;
        }
    }
    policy-statement P-B {
        from {
            route-filter-list RFL-DEFAULT;
        }
        then reject;
    }
    policy-statement PS-COND {
        term DEFAULT-PRESENT {
            from condition COND-DEFAULT;
            then accept;
        }
        term REST {
            from {
                route-filter-list RFL-MIXED;
            }
            then reject;
        }
    }
    policy-statement PS-EXPORT {
        term LOOPBACK {
            from {
                protocol direct;
                route-filter 10.255.0.0/16 prefix-length-range /32-/32;
            }
            then {
                community add CM-CUSTOMER;
                accept;
            }
        }
        inactive: term STATIC {
            from protocol static;
            then accept;
        }
        term REJECT {
            then reject;
        }
    }
    policy-statement PS-TRANSIT-IN {
        term REJECT-BOGONS {
            from {
                route-filter 10.0.0.0/8 orlonger;
                route-filter 192.168.0.0/16 orlonger reject;
            }
            then reject;
        }
        term PRIVATE-AS {
            from as-path AP-PRIVATE;
            then reject;
        }
        term ACCEPT {
            then {
                local-preference 120;
                community add CM-TRANSIT;
                accept;
            }
        }
    }
    community CM-CUSTOMER members [ 64496:100 64496:200 ];
    community CM-NO-EXPORT members no-export;
    community CM-REGEX members "^64496:1[0-9]+$";
    community CM-RT-ANY members target:64496:*;
    community CM-TRANSIT members 64497:300;
    as-path AP-PRIVATE "^6450[0-9]$";
    condition COND-DEFAULT {
        if-route-exists {
            0.0.0.0/0;
            table inet.0;
        }
    }
}
