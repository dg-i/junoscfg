firewall {
    family inet {
        filter FW-PROTECT-RE {
            term SSH {
                from {
                    source-prefix-list {
                        PL-MGMT;
                    }
                    protocol tcp;
                    destination-port [ ssh 830 ];
                }
                then accept;
            }
            inactive: term ICMP {
                from {
                    protocol icmp;
                }
                then {
                    policer P-1M;
                    accept;
                }
            }
            term DEFAULT {
                then {
                    count c-default;
                    log;
                    discard;
                }
            }
        }
    }
    ##
    ## Warning: configuration block ignored: unsupported platform (vmx)
    ##
    family ethernet-switching {
        filter FW-L2 {
            term BLOCK-MAC {
                from {
                    source-mac-address {
                        00:00:5e:00:53:66/48;
                    }
                }
                then discard;
            }
            term ALLOW {
                then accept;
            }
