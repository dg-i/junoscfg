                arp-inspection;
                ip-source-guard;
            }
        }
    }
    V200 {
        vlan-id 200;
        forwarding-options {
            filter {
                input FW-L2; ## reference 'FW-L2' not found
            }
        }
    }
    V300-RANGE {
        vlan-id-list [ 300-310 320 ];
    }
    inactive: V999 {
        vlan-id 999;
    }
}
