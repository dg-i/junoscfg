system {
    host-name router1;
    domain-name example.com;
    time-zone UTC;
    root-authentication {
        encrypted-password "$9$ExAmPlEhAsH.KEY";
    }
    name-server {
        192.168.0.53;
        192.168.0.54;
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$9$ExAmPlEhAsH.KEY";
            }
        }
        user operator {
            uid 2001;
            class read-only;
            authentication {
                encrypted-password "$9$ExAmPlEhAsH.KEY";
            }
        }
    }
    services {
        ssh {
            root-login deny;
            protocol-version v2;
        }
        netconf {
            ssh;
        }
    }
    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
        host 192.168.0.10 {
            any warning;
        }
    }
    ntp {
        server 192.168.0.123;
    }
}
interfaces {
    ge-0/0/0 {
        description "uplink to core";
        mtu 9192;
        unit 0 {
            family inet {
                address 198.51.100.1/30;
            }
            family inet6 {
                address 2001:db8:100::1/126;
            }
        }
    }
    ge-0/0/1 {
        description "downlink to access";
        unit 0 {
            vlan-id 100;
            family inet {
                address 10.0.100.1/24;
            }
        }
    }
    ge-0/0/2 {
        description "customer handoff";
        ether-options {
            802.3ad ae0;
        }
    }
    ge-0/0/3 {
        description "customer handoff backup";
        ether-options {
            802.3ad ae0;
        }
    }
    ae0 {
        description "bundled customer handoff";
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family inet {
                address 10.0.200.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.255.1/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.255.1;
    autonomous-system 64496;
    static {
        route 0.0.0.0/0 {
            next-hop 198.51.100.2;
        }
    }
}
protocols {
    bgp {
        group ebgp-peers {
            type external;
            peer-as 64497;
            neighbor 198.51.100.2 {
                description "transit provider";
                import import-transit;
                export export-customers;
            }
        }
        group ibgp-peers {
            type internal;
            local-address 10.255.255.1;
            neighbor 10.255.255.2 {
                description "core router";
            }
        }
    }
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                metric 10;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
    lldp {
        interface all;
    }
}
policy-options {
    policy-statement import-transit {
        term reject-bogons {
            from {
                route-filter 10.0.0.0/8 orlonger;
            }
            then reject;
        }
        term accept-rest {
            then accept;
        }
    }
    policy-statement export-customers {
        term customers {
            from {
                community customer-routes;
            }
            then accept;
        }
        term default {
            then reject;
        }
    }
    community customer-routes members 64496:100;
}
firewall {
    family inet {
        filter protect-re {
            term allow-ssh {
                from {
                    source-address {
                        10.0.0.0/8;
                    }
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }
            term discard-rest {
                then {
                    discard;
                }
            }
        }
    }
}
